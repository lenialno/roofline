name: Parser, flag or metric mismatch
description: task doctor found a table entry that does not match your vLLM or SGLang version
title: "mismatch: <runtime> <version>: <parser, flag or metric>"
labels: ["mismatch"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before posting, remove internal hostnames, paths and anything else private from the output.
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [vLLM, SGLang]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Runtime version
      placeholder: "0.31.0"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "Qwen/Qwen3-32B-FP8"
  - type: textarea
    id: doctor
    attributes:
      label: Output of task doctor
      render: text
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What worked instead
      description: The parser name, flag or metric that works on your version, if you found it.
