# Repository entry point: exposes the toolbox tasks without a namespace.
#   task -t /path/to/roofline/Taskfile.yml health
# The real Taskfile lives in skills/roofline-toolbox/ so that the skill works on its own.
version: '3'

includes:
  toolbox:
    taskfile: ./skills/roofline-toolbox/Taskfile.yml
    flatten: true
